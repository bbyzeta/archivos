server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: file-manager
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/archivos_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    # Base64 de al menos 32 bytes. Definir JWT_SECRET en todo entorno distinto de desarrollo.
    secret-key: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0wMTIzNDU2Nzg5YWJjZGVm}
    expiration: ${JWT_EXPIRATION_MS:86400000}

app:
  # IP o dominio público con el que se arman los links de descarga
  base-url: ${APP_BASE_URL:http://localhost:8081}
  storage:
    base-path: ${STORAGE_BASE_PATH:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
